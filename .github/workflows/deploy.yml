name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - run: flutter pub get

      # --no-web-resources-cdn: canvaskit se sirve desde el propio sitio para
      # que el service worker lo guarde y la app abra sin conexión.
      - run: flutter build web --release --base-href "/himnario/" --no-web-resources-cdn

      # Huella de cada hoja: la app la compara para saber cuáles cambiaron.
      - run: python3 tool/generar_versiones.py assets/HIMNARIOS/IBEFI build/web/versiones.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
